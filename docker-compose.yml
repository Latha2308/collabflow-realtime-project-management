version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: collabflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-collabflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collabflow_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-collabflow_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-collabflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: collabflow-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-collabflow}:${POSTGRES_PASSWORD:-collabflow_dev_password}@postgres:5432/${POSTGRES_DB:-collabflow_db}
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_change_in_production}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5174,http://localhost:3000,http://frontend:5173,http://playwright:5173}
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: collabflow-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8001
      VITE_WS_BASE_URL: ws://localhost:8001
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    stdin_open: true
    tty: true

  playwright:
    build:
      context: ./frontend
      dockerfile: Dockerfile.playwright
    container_name: collabflow-playwright
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      PLAYWRIGHT_BASE_URL: http://frontend:5173
      API_BASE_URL: http://backend:8000
    depends_on:
      - frontend
      - backend
    command: tail -f /dev/null
    networks:
      - default

volumes:
  postgres-data:

networks:
  default:
    driver: bridge
